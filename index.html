<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FBEBD2">

<title>Cardápio BONAPPETTI</title>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
  --bg:#FBEBD2;
  --card:#F6E1C5;
  --card-hover:#F8E7D1;
  --ink:#4A2B22;
  --mut:#806157;
  --line:#CBA596;
  --acc:#6B382A;
  --cream:#FFF7F0;
  --shadow:0 5px 18px rgba(77,43,33,.08);
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
  scroll-padding-top:145px;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:15px/1.45 Inter,system-ui,sans-serif;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.16;
  background-image:radial-gradient(
    rgba(107,56,42,.12) .7px,
    transparent .7px
  );
  background-size:9px 9px;
  z-index:-1;
}

button,
input{
  font-family:inherit;
}

.wrap{
  width:min(100%,720px);
  margin:0 auto;
  padding:0 15px;
}

/* =========================
   HEADER
========================= */

header{
  background:var(--bg);
  border-bottom:1px solid rgba(107,56,42,.18);
}

.top{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px 0 7px;
}

.logo{
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
}

.logo img{
  width:min(240px,72vw);
  height:auto;
  max-height:86px;
  object-fit:contain;
  display:block;
}

.hero{
  text-align:center;
  padding:5px 0 16px;
}

.hero h1{
  font:700 clamp(27px,8vw,38px)/1.1 Fraunces,Georgia,serif;
  margin:0 0 5px;
  color:var(--ink);
}

.hero p{
  margin:0;
  color:var(--mut);
  font-size:14px;
}

/* =========================
   BARRA
========================= */

.bar{
  position:sticky;
  top:0;
  z-index:10;
  background:rgba(251,235,210,.96);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(107,56,42,.16);
  padding-top:env(safe-area-inset-top,0px);
  box-shadow:0 3px 12px rgba(77,43,33,.06);
}

.search{
  padding:10px 0 6px;
}

.search input{
  width:100%;
  font:500 15px Inter,sans-serif;
  padding:13px 15px;
  border:1px solid var(--line);
  border-radius:14px;
  background:var(--cream);
  color:var(--ink);
  box-shadow:0 2px 8px rgba(77,43,33,.05);
}

.search input::placeholder{
  color:#96796e;
}

.search input:focus{
  outline:2px solid var(--acc);
  outline-offset:1px;
}

/* =========================
   CATEGORIAS
========================= */

.tabs{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding:4px 0 10px;
  scrollbar-width:none;
}

.tabs::-webkit-scrollbar{
  display:none;
}

.tabs button{
  flex:none;
  font:600 13px Inter,sans-serif;
  color:var(--mut);
  background:rgba(255,247,240,.52);
  border:1px solid var(--line);
  border-radius:999px;
  padding:8px 13px;
  min-height:38px;
  cursor:pointer;
  transition:.15s ease;
}

.tabs button:hover{
  background:var(--card-hover);
}

.tabs button.on{
  color:var(--cream);
  background:var(--acc);
  border-color:var(--acc);
  box-shadow:0 3px 8px rgba(107,56,42,.16);
}

/* =========================
   CONTEÚDO
========================= */

main{
  padding-bottom:10px;
}

section{
  padding:24px 0 0;
}

section h2{
  font:700 25px/1.1 Fraunces,Georgia,serif;
  margin:0 0 12px;
  color:var(--ink);
  display:flex;
  align-items:baseline;
  gap:8px;
}

section h2:after{
  content:"";
  height:1px;
  flex:1;
  background:var(--line);
  margin-left:4px;
}

section h2 small{
  font:500 11px Inter,sans-serif;
  color:var(--mut);
  white-space:nowrap;
}

.list{
  display:block;
}

/* =========================
   PRODUTOS
========================= */

.item{
  position:relative;
  display:grid;
  grid-template-columns:minmax(0,1fr) 92px;
  column-gap:13px;
  row-gap:7px;
  margin:0 0 12px;
  padding:11px;
  background:var(--card);
  border:1px solid rgba(107,56,42,.12);
  border-radius:17px;
  box-shadow:var(--shadow);
  align-items:start;
  transition:transform .15s ease,background .15s ease;
}

.item:active{
  transform:scale(.992);
  background:var(--card-hover);
}

.item > div:first-child{
  min-width:0;
  padding-top:2px;
  grid-column:1;
  grid-row:1;
}

.item h3{
  margin:0 0 5px;
  font:700 15px/1.25 Inter,sans-serif;
  color:var(--ink);
}

.item p{
  margin:0;
  color:var(--mut);
  font-size:13px;
  line-height:1.35;
}

/* =========================
   IMAGEM
========================= */

.th{
  grid-column:2;
  grid-row:1 / span 2;
  width:92px;
  height:92px;
  border-radius:13px;
  overflow:hidden;
  background:linear-gradient(145deg,#E6C8B9,#DAB5A5);
  display:flex;
  align-items:center;
  justify-content:center;
  font:700 29px Fraunces,Georgia,serif;
  color:var(--acc);
  border:1px solid rgba(107,56,42,.12);
}

.th img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.th.zoom{
  cursor:zoom-in;
}

.th.erro-img{
  font:600 11px Inter,sans-serif;
  text-align:center;
  padding:8px;
  color:var(--mut);
}

/* =========================
   PREÇO
========================= */

.f{
  grid-column:1;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin:0;
  padding-top:1px;
  color:var(--mut);
  font-size:12px;
  min-width:0;
}

.f span:first-child{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.preco{
  font:700 16px Inter,sans-serif;
  color:var(--acc);
  white-space:nowrap;
  order:-1;
}

.preco small{
  font:600 11px Inter,sans-serif;
  color:var(--mut);
}

/* =========================
   SEM RESULTADO
========================= */

.vazio{
  padding:50px 15px;
  text-align:center;
  color:var(--mut);
}

.vazio strong{
  display:block;
  font:700 22px Fraunces,Georgia,serif;
  color:var(--ink);
  margin-bottom:6px;
}

/* =========================
   ZOOM
========================= */

.lb{
  position:fixed;
  inset:0;
  z-index:20;
  background:rgba(61,34,27,.9);
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:12px;
  padding:20px 16px;
}

.lb.on{
  display:flex;
}

.lb img{
  max-width:100%;
  max-height:75vh;
  object-fit:contain;
  border-radius:14px;
  background:var(--cream);
  box-shadow:0 10px 35px rgba(0,0,0,.25);
}

.lb span{
  color:var(--cream);
  font:600 16px Inter,sans-serif;
  text-align:center;
}

.lb button{
  position:absolute;
  top:15px;
  right:12px;
  width:48px;
  height:48px;
  border:0;
  border-radius:50%;
  background:var(--cream);
  color:var(--ink);
  font:400 28px/1 Inter,sans-serif;
  cursor:pointer;
}

/* =========================
   RODAPÉ
========================= */

footer{
  margin:36px 0 20px;
  color:var(--mut);
  font-size:12px;
  text-align:center;
  padding:22px 8px 8px;
  border-top:1px solid var(--line);
}

.footer-title{
  font:700 17px Fraunces,Georgia,serif;
  color:var(--ink);
  margin-bottom:7px;
}

.footer-review,
.footer-instagram{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  text-decoration:none;
  font-weight:700;
}

.footer-review{
  margin:10px auto 7px;
  padding:10px 15px;
  border-radius:999px;
  background:var(--acc);
  color:var(--cream);
  box-shadow:0 4px 10px rgba(107,56,42,.14);
}

.footer-instagram{
  display:block;
  color:var(--acc);
  margin-top:4px;
}

.footer-copy{
  margin-top:13px;
  line-height:1.5;
}

/* =========================
   DESKTOP
========================= */

@media(min-width:680px){

  .wrap{
    width:min(100%,980px);
    padding:0 22px;
  }

  .logo img{
    width:260px;
  }

  .list{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }

  .item{
    margin:0;
  }
}

/* =========================
   CELULAR PEQUENO
========================= */

@media(max-width:380px){

  .wrap{
    padding-left:11px;
    padding-right:11px;
  }

  .item{
    grid-template-columns:minmax(0,1fr) 82px;
    column-gap:10px;
  }

  .th{
    width:82px;
    height:82px;
  }

  .item h3{
    font-size:14px;
  }

  .item p{
    font-size:12px;
  }

  .preco{
    font-size:15px;
  }
}

</style>
</head>

/* =========================================================
   FUNÇÕES GERAIS
========================================================= */

const $ = id => document.getElementById(id);

const esc = s => {

  return String(s).replace(
    /[&<>"']/g,
    c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[c])
  );

};


const norm = s => {

  return String(s)
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .toLowerCase()
    .trim();

};


let cat = "todos";
let termo = "";


/* =========================================================
   PREÇO
========================================================= */

function precoHTML(p,u){

  const v =
    typeof p === "number"
      ? p.toLocaleString(
          "pt-BR",
          {
            minimumFractionDigits:2,
            maximumFractionDigits:2
          }
        )
      : p;

  const suf =
    u === "kg"
      ? "/kg"
      : u === "fatia"
        ? "/fatia"
        : "";

  return `
    R$ ${v}
    ${
      suf
        ? `<small>${suf}</small>`
        : ""
    }
  `;

}


/* =========================================================
   DESCRIÇÕES
========================================================= */

function descricao(nome){

  const n = norm(nome);


  if(n.includes("cafe ao leite"))
    return "Café preparado com leite.";


  if(n === "cafe expresso")
    return "Café espresso preparado na máquina.";


  if(n.includes("cafe de maquina"))
    return "Café preparado na máquina.";


  if(n === "capuccino")
    return "Café cremoso com leite e chocolate.";


  if(n.includes("capuccino com canela"))
    return "Capuccino cremoso finalizado com canela.";


  if(n === "chocolate quente")
    return "Bebida quente e cremosa de chocolate.";


  if(n.includes("cafe bom jesus"))
    return "Café torrado e moído.";


  if(n.includes("cafe"))
    return "Café selecionado.";


  if(n.includes("leite"))
    return "Leite integral.";


  if(n.includes("suco"))
    return "Bebida de fruta pronta para beber.";


  if(n.includes("agua de coco"))
    return "Água de coco.";


  if(n.includes("energetico"))
    return "Energético.";


  if(n.includes("cerveja"))
    return "Cerveja.";


  if(n.includes("refrigerante"))
    return "Refrigerante.";


  if(n.includes("brigadeiro"))
    return "Doce artesanal.";


  if(n.includes("brownie"))
    return "Brownie de chocolate.";


  if(n.includes("cookie"))
    return "Cookie artesanal.";


  if(n.includes("bolo"))
    return "Bolo artesanal.";


  if(n.includes("torta"))
    return "Torta artesanal.";


  if(n.includes("pao"))
    return "Pão artesanal.";


  if(n.includes("coxinha"))
    return "Salgado artesanal.";


  if(n.includes("pastel"))
    return "Pastel recheado.";


  if(n.includes("sanduiche"))
    return "Sanduíche preparado na hora.";


  if(n.includes("wrap"))
    return "Wrap preparado com ingredientes selecionados.";


  if(n.includes("requeijao"))
    return "Requeijão cremoso.";


  if(n.includes("manteiga"))
    return "Manteiga de qualidade.";


  if(n.includes("queijo"))
    return "Queijo.";


  if(n.includes("mortadela"))
    return "Frios selecionados.";


  if(n.includes("presunto"))
    return "Presunto fatiado.";


  if(n.includes("salsicha"))
    return "Salsicha.";


  if(n.includes("pate"))
    return "Patê.";


  return "";

}


/* =========================================================
   TAMANHO
========================================================= */

function tamanho(nome){

  const matches = [
    ...String(nome).matchAll(
      /(\d+(?:[.,]\d+)?)\s?(ml|l|g|kg)\b/gi
    )
  ];

  const m = matches.pop();

  if(!m)
    return "";

  return `${m[1]}${m[2].toLowerCase()}`;

}


/* =========================================================
   CARD
========================================================= */

function card(p){

  const [
    nome,
    ,
    preco,
    un,
    obs
  ] = p;


  const extras = [
    obs,
    tamanho(nome),
    un === "kg"
      ? "Por kg"
      : un === "fatia"
        ? "Fatia"
        : ""
  ]
    .filter(Boolean)
    .join(" • ");


  const f = FOTOS[nome];


  const foto = f

    ? `
      <img
        src="${esc(f)}"
        alt="${esc(nome)}"
        loading="lazy"
        onerror="
          this.style.display='none';
          this.parentElement.classList.add('erro-img');
          this.parentElement.textContent='Imagem não encontrada';
        "
      >
    `

    : esc(
        nome.trim()[0].toUpperCase()
      );


  const d = descricao(nome);


  return `

    <article class="item">

      <div>

        <h3>
          ${esc(nome)}
        </h3>

        ${
          d
            ? `<p>${esc(d)}</p>`
            : ""
        }

      </div>


      <div
        class="th${f ? " zoom" : ""}"

        ${
          f
            ? `
              role="button"
              tabindex="0"
              data-img="${esc(f)}"
              data-nome="${esc(nome)}"
              aria-label="Ampliar foto de ${esc(nome)}"
            `
            : ""
        }

      >

        ${foto}

      </div>


      <div class="f">

        <span>
          ${esc(extras)}
        </span>

        <span class="preco">
          ${precoHTML(preco,un)}
        </span>

      </div>

    </article>

  `;

}


/* =========================================================
   TABS
========================================================= */

function tabs(){

  const all = {
    todos:"Todos",
    ...CATEGORIAS
  };


  $("tabs").innerHTML =

    Object.entries(all)

      .map(
        ([k,v]) => `

          <button
            type="button"
            data-k="${esc(k)}"
            class="${k === cat ? "on" : ""}"
            aria-pressed="${k === cat}"
          >
            ${esc(v)}
          </button>

        `
      )

      .join("");

}


/* =========================================================
   RENDER
========================================================= */

function render(){

  const busca = norm(termo);


  const filtrados = produtos.filter(p => {

    const nome = p[0];
    const categoria = p[1];

    const pertenceCategoria =
      cat === "todos" ||
      categoria === cat;

    const pertenceBusca =
      !busca ||
      norm(nome).includes(busca) ||
      norm(descricao(nome)).includes(busca);

    return pertenceCategoria && pertenceBusca;

  });


  if(!filtrados.length){

    $("main").innerHTML = `

      <div class="vazio">

        <strong>Nenhum produto encontrado</strong>

        <span>
          Tente buscar por outro nome ou categoria.
        </span>

      </div>

    `;

    return;

  }


  if(busca){

    $("main").innerHTML = `

      <section>

        <h2>
          Resultados
          <small>${filtrados.length} item(ns)</small>
        </h2>

        <div class="list">
          ${filtrados.map(card).join("")}
        </div>

      </section>

    `;

    return;

  }


  const grupos = {};


  filtrados.forEach(p => {

    const categoria = p[1];

    if(!grupos[categoria])
      grupos[categoria] = [];

    grupos[categoria].push(p);

  });


  const nomesCategorias = {
    caf:"Cafés",
    bev:"Bebidas",
    doc:"Doces",
    bol:"Bolos e Tortas",
    pao:"Pães",
    sal:"Salgados",
    lan:"Lanches",
    bis:"Biscoitos",
    fri:"Frios e Laticínios",
    out:"Outros"
  };


  $("main").innerHTML =

    Object.entries(grupos)

      .map(([codigo,itens]) => `

        <section data-category="${esc(codigo)}">

          <h2>

            ${esc(nomesCategorias[codigo] || codigo)}

            <small>
              ${itens.length} item(ns)
            </small>

          </h2>

          <div class="list">
            ${itens.map(card).join("")}
          </div>

        </section>

      `)

      .join("");

}


/* =========================================================
   CLIQUE NAS CATEGORIAS
========================================================= */

$("tabs").addEventListener(
  "click",
  e => {

    const b =
      e.target.closest("button");

    if(!b)
      return;


    cat = b.dataset.k;


    tabs();
    render();


    window.scrollTo({
      top:0,
      behavior:"smooth"
    });


    requestAnimationFrame(() => {

      const ativo =
        $("tabs").querySelector(
          `button[data-k="${CSS.escape(cat)}"]`
        );

      if(ativo){

        ativo.scrollIntoView({
          inline:"center",
          block:"nearest",
          behavior:"smooth"
        });

      }

    });

  }
);


/* =========================================================
   ZOOM
========================================================= */

const lb = $("lb");


function abrir(t){

  $("lbi").src =
    t.dataset.img;

  $("lbi").alt =
    t.dataset.nome;

  $("lbt").textContent =
    t.dataset.nome;

  lb.classList.add("on");

  lb.setAttribute(
    "aria-hidden",
    "false"
  );

  document.body.style.overflow =
    "hidden";

}


function fechar(){

  lb.classList.remove("on");

  lb.setAttribute(
    "aria-hidden",
    "true"
  );

  $("lbi").src = "";
  $("lbi").alt = "";
  $("lbt").textContent = "";

  document.body.style.overflow =
    "";

}


/* Clique */

$("main").addEventListener(
  "click",
  e => {

    const t =
      e.target.closest(".zoom");

    if(t)
      abrir(t);

  }
);


/* Teclado */

$("main").addEventListener(
  "keydown",
  e => {

    const t =
      e.target.closest(".zoom");

    if(
      t &&
      (
        e.key === "Enter" ||
        e.key === " "
      )
    ){

      e.preventDefault();

      abrir(t);

    }

  }
);


/* Fechar clicando fora */

lb.addEventListener(
  "click",
  e => {

    if(
      e.target === lb ||
      e.target === $("lbx")
    ){

      fechar();

    }

  }
);


/* Botão fechar */

$("lbx").addEventListener(
  "click",
  e => {

    e.stopPropagation();

    fechar();

  }
);


/* ESC */

document.addEventListener(
  "keydown",
  e => {

    if(
      e.key === "Escape" &&
      lb.classList.contains("on")
    ){

      fechar();

    }

  }
);


/* =========================================================
   BUSCA
========================================================= */

$("q").addEventListener(
  "input",
  e => {

    termo =
      e.target.value;

    render();

  }
);

========================================================= */

function carregarLogo(){

  if(!CONFIG.logo){

    $("logo").innerHTML = `

      <strong
        style="
          font:700 22px Fraunces,Georgia,serif;
          color:var(--acc);
          text-align:center;
        "
      >
        BONAPPETTI
      </strong>

    `;

    return;

  }


  $("logo").innerHTML = `

    <img
      src="${esc(CONFIG.logo)}"
      alt="${esc(CONFIG.nome)}"
      onerror="
        this.style.display='none';
        this.parentElement.innerHTML='<strong style=\\'font:700 22px Fraunces,Georgia,serif;color:var(--acc)\\'>BONAPPETTI</strong>';
      "
    >

  `;

}

produtos.forEach(([nome]) => {
  if (!FOTOS[nome]) {
    FOTOS[nome] = "fotos/sem-foto.jpg";
  }
});


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

carregarLogo();

tabs();
